<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品素材对照</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae4;font-family:Arial,"PingFang SC",sans-serif;color:#171714}header{padding:20px 28px;position:sticky;top:0;background:rgba(238,234,228,.95);z-index:2;border-bottom:1px solid #bbb}h1{margin:0;font-size:24px}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;padding:20px}.card{background:white;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.card p{margin:0;padding:10px;font-size:12px;line-height:1.35}@media(max-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><h1>现有 16 件商品素材</h1></header><main class="grid" id="grid"></main><script src="data.js"></script><script>document.querySelector('#grid').innerHTML=PRODUCTS.map(p=>`<article class="card"><img src="assets/products/${p.img}"><p><b>${p.id} · ${p.zh}</b><br>${p.cat} · ${money(p.price)}</p></article>`).join('')</script></body></html>
